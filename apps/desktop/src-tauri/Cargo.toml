[package]
name = "echo-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Echo Desktop Contributors"]
license = "GPL-3.0"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

echo-core = { workspace = true }
echo-provider = { workspace = true }
echo-audio = { workspace = true }
echo-lyrics = { workspace = true, features = ["remote"] }

[dev-dependencies]
async-trait = { workspace = true }
