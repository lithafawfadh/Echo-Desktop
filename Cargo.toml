[workspace]
resolver = "2"
members = [
    "crates/echo-core",
    "crates/echo-provider",
    "crates/echo-audio",
    "crates/echo-lyrics",
    "crates/echo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Echo Desktop Contributors"]
license = "GPL-3.0"

[workspace.dependencies]
# Async Runtime & Utilities
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Internal workspace crates
echo-core = { path = "crates/echo-core" }
echo-provider = { path = "crates/echo-provider" }
echo-audio = { path = "crates/echo-audio" }
echo-lyrics = { path = "crates/echo-lyrics" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
